[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dolphin-memory"
version = "0.2.0"
description = "Give your AI a brain. Persistent graph-enhanced memory for LLMs."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "DewashishCodes", email = "dewashish@dolphin.dev"}
]
keywords = ["ai", "memory", "llm", "agents", "mcp", "knowledge-graph", "rag", "graphrag", "personalization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy>=1.24",
    "fastembed>=0.3.0",
    "mcp>=1.2.0",
    "ollama>=0.3.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
supabase = ["supabase>=2.0.0", "sentence-transformers>=2.2.0"]
cloud = ["langchain-google-genai>=1.0.0", "langchain-openai>=0.1.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0"]

[project.urls]
Homepage = "https://github.com/DewashishCodes/dolphin"
Documentation = "https://github.com/DewashishCodes/dolphin#readme"
Repository = "https://github.com/DewashishCodes/dolphin"
Issues = "https://github.com/DewashishCodes/dolphin/issues"

[project.scripts]
dolphin = "dolphin_memory.cli:main"
dolphin-setup = "dolphin_memory.setup:run_setup"

[tool.setuptools.packages.find]
include = ["dolphin_memory*"]

[tool.setuptools.package-data]
dolphin_memory = ["*.sql", "*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
